<svg width="100%" height="200" viewBox="0 0 1000 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#080b11" />
    </linearGradient>
    <linearGradient id="cyan-purple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="line-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.1" />
    </linearGradient>
  </defs>

  <rect width="1000" height="200" rx="16" fill="url(#bg-grad)" stroke="#1f2937" stroke-width="1.5" />

  <!-- Animated Background Waves (Strictly Behind Text) -->
  <g opacity="0.45">
    <path d="M-100,160 Q150,90 400,150 T900,110 T1100,160" fill="none" stroke="url(#line-grad)" stroke-width="1.5">
      <animate attributeName="d" dur="10s" repeatCount="indefinite" values="M-100,160 Q150,90 400,150 T900,110 T1100,160; M-100,140 Q150,180 400,120 T900,170 T1100,130; M-100,160 Q150,90 400,150 T900,110 T1100,160" />
    </path>
    <path d="M-100,175 Q200,130 500,180 T950,140 T1100,180" fill="none" stroke="#818cf8" stroke-opacity="0.25" stroke-width="1">
      <animate attributeName="d" dur="14s" repeatCount="indefinite" values="M-100,175 Q200,130 500,180 T950,140 T1100,180; M-100,155 Q200,195 500,140 T950,185 T1100,155; M-100,175 Q200,130 500,180 T950,140 T1100,180" />
    </path>
  </g>

  <!-- Dynamic Glowing Nodes -->
  <circle cx="120" cy="60" r="3" fill="#38bdf8">
    <animate attributeName="opacity" values="0.2;0.9;0.2" dur="3s" repeatCount="indefinite" />
    <animate attributeName="r" values="2;4;2" dur="3s" repeatCount="indefinite" />
  </circle>
  <circle cx="880" cy="50" r="3.5" fill="#c084fc">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="4s" repeatCount="indefinite" />
    <animate attributeName="r" values="2.5;5;2.5" dur="4s" repeatCount="indefinite" />
  </circle>
  <circle cx="920" cy="145" r="3" fill="#818cf8">
    <animate attributeName="opacity" values="0.2;0.8;0.2" dur="3.5s" repeatCount="indefinite" />
  </circle>
  <circle cx="75" cy="140" r="2.5" fill="#38bdf8">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="4.5s" repeatCount="indefinite" />
  </circle>

  <!-- Foreground Title & Subtitle -->
  <g id="foreground">
    <rect x="405" y="25" width="190" height="24" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1" opacity="0.95" />
    <text x="500" y="41" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" text-anchor="middle" letter-spacing="1.5">CURATED ECOSYSTEM</text>

    <text x="500" y="98" fill="url(#cyan-purple)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="800" text-anchor="middle" letter-spacing="-0.5">Awesome IT Asset Management</text>

    <text x="500" y="132" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle">Open-Source ITAM Platforms • Enterprise SaaS • Hardware &amp; License Compliance</text>

    <g transform="translate(325, 155)">
      <rect x="0" y="0" width="100" height="20" rx="10" fill="#1e293b" stroke="#334155" stroke-width="0.8" />
      <text x="50" y="14" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle">Hardware ITAM</text>

      <rect x="110" y="0" width="130" height="20" rx="10" fill="#1e293b" stroke="#334155" stroke-width="0.8" />
      <text x="175" y="14" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle">Software SAM</text>

      <rect x="250" y="0" width="100" height="20" rx="10" fill="#1e293b" stroke="#334155" stroke-width="0.8" />
      <text x="300" y="14" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" text-anchor="middle">Asset Discovery</text>
    </g>
  </g>
</svg>